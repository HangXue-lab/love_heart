<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ I Love You ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000; cursor: default;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; }
  .text {
    position: absolute; top: 18%; left: 50%;
    transform: translate(-50%, -50%); text-align: center;
    pointer-events: none; z-index: 10;
  }
  .text h1 {
    font-family: 'Georgia', serif;
    font-size: clamp(1.5rem, 4vw, 3.2rem); color: #fff;
    text-shadow: 0 0 15px #ff4477, 0 0 40px #ff3366, 0 0 80px #cc2255;
    animation: glow 2s ease-in-out infinite alternate;
    letter-spacing: 0.04em;
  }
  .text p {
    font-family: 'Georgia', serif;
    font-size: clamp(0.8rem, 1.5vw, 1.1rem); color: #ffb3c6;
    text-shadow: 0 0 8px #ff4477; margin-top: 0.3em; opacity: 0.8;
  }
  @keyframes glow {
    0%   { text-shadow: 0 0 15px #ff4477, 0 0 40px #ff3366, 0 0 80px #cc2255; }
    100% { text-shadow: 0 0 25px #ff6699, 0 0 60px #ff4477, 0 0 120px #cc2255; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text">
  <h1>I Love You ❤️</h1>
  <p>你是我生命中最美的意外</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Heart parametric equations ────────────────
  function hx(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function hy(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

  // ── Heart particles - fill interior with random points ─────────
  const HCOUNT = 500;
  let heartParticles = [];
  function createHeartParticle() {
    // Rejection sampling: generate random point inside bounding box
    // Heart bounding box: x in [-17, 17], y in [-20, 14]
    let x, y;
    for (let attempt = 0; attempt < 50; attempt++) {
      x = (Math.random() - 0.5) * 34;
      y = (Math.random() - 0.5) * 34 + 3; // shift up slightly
      // Check if inside heart using parametric inequality
      // Point is inside if distance to curve along radial direction is positive
      const angle = Math.atan2(y, x);
      let t = angle;
      if (t < 0) t += Math.PI * 2;
      const hx_t = hx(t);
      const hy_t = hy(t);
      const dist = Math.sqrt(x*x + y*y);
      const curveDist = Math.sqrt(hx_t*hx_t + hy_t*hy_t);
      if (dist < curveDist * 0.95) { // 0.95 for slight padding
        return {
          x: x, y: y,
          r:   0.8 + Math.random() * 2.2,
          hue: 340 + Math.random() * 18,
          alpha: 0.6 + Math.random() * 0.4,
          spread: 0.5 + Math.random() * 0.7,
          orbitA: 0.2 + Math.random() * 1.2,
          orbitS: 0.3 + Math.random() * 1.0,
          orbitP: Math.random() * Math.PI * 2,
        };
      }
    }
    // Fallback to boundary point if sampling fails
    const t = Math.random() * Math.PI * 2;
    return {
      x: hx(t), y: hy(t),
      r: 1.0 + Math.random() * 2.0,
      hue: 340 + Math.random() * 18,
      alpha: 0.5 + Math.random() * 0.5,
      spread: 0.4 + Math.random() * 0.6,
      orbitA: 0.3 + Math.random() * 1.5,
      orbitS: 0.3 + Math.random() * 1.0,
      orbitP: Math.random() * Math.PI * 2,
    };
  }
  function initHeart() {
    heartParticles = [];
    for (let i = 0; i < HCOUNT; i++) {
      heartParticles.push(createHeartParticle());
    }
  }
  initHeart();

  // ── Falling particles ─────────────────────────
  let fallingParticles = [];

  // ── Pool particles ────────────────────────────
  const PCOUNT = 100;
  let poolParticles = [];
  function createPoolParticle() {
    return {
      x: Math.random() * W,
      baseY: H * (0.78 + Math.random() * 0.18),
      r: 1.5 + Math.random() * 3.5,
      hue: 245 + Math.random() * 35,
      alpha: 0.3 + Math.random() * 0.4,
      phase: Math.random() * Math.PI * 2,
      bobAmp: 3 + Math.random() * 8,
      bobSpd: 0.3 + Math.random() * 0.7,
      rippleDx: 0, rippleDy: 0, rippleLife: 0,
    };
  }
  function initPool() {
    poolParticles = [];
    for (let i = 0; i < PCOUNT; i++) poolParticles.push(createPoolParticle());
  }
  initPool();

  // ── Splash particles ──────────────────────────
  let splashParticles = [];

  // ── Impact ripples ────────────────────────────
  let ripples = [];

  let time = 0, frame = 0;

  // ── Detach helper - check if particle is near bottom tip ─────
  function isBottom(p) {
    // Bottom tip is at y ≈ -20 in normalized coordinates
    // Check if particle is in lower part of heart
    return p.y < -5;
  }

  // ── Animation ─────────────────────────────────
  function draw() {
    time += 0.016; frame++;
    const scl = Math.min(W, H) * 0.028;
    const cx = W / 2;
    const cy = H / 2 - H * 0.06;
    const beat = 1 + 0.065 * Math.sin(time * 4.2); // 0.935 ~ 1.065
    const poolTop = H * 0.74;

    ctx.clearRect(0, 0, W, H);

    // ── Pure black background ───────────────────
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // ── Pool base glow (soft area) ──────────────
    const poolGlow = ctx.createRadialGradient(cx, poolTop + H * 0.08, H*0.05, cx, poolTop + H*0.1, H*0.55);
    poolGlow.addColorStop(0, 'rgba(140,160,255,0.07)');
    poolGlow.addColorStop(0.5, 'rgba(120,140,240,0.03)');
    poolGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = poolGlow;
    ctx.fillRect(0, poolTop - H*0.1, W, H*0.4);

    // ── Heart glow ──────────────────────────────
    const hGlow = ctx.createRadialGradient(cx, cy, scl*3, cx, cy, scl*16);
    hGlow.addColorStop(0, 'rgba(255,40,80,0.15)');
    hGlow.addColorStop(0.5, 'rgba(255,30,60,0.04)');
    hGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hGlow;
    ctx.beginPath(); ctx.arc(cx, cy, scl*16, 0, Math.PI*2); ctx.fill();

    // ── Update & draw heart particles ───────────
    for (let i = heartParticles.length - 1; i >= 0; i--) {
      const p = heartParticles[i];

      // Position: scale + beat + spread + orbit
      const spreadAmount = (beat - 1) * p.spread * scl * 0.6;
      const sx = cx + (p.x + (Math.random()-0.5)*0.2) * scl * beat + spreadAmount;
      const sy = cy + (p.y + (Math.random()-0.5)*0.2) * scl * beat + spreadAmount;
      const ox = Math.cos(time * p.orbitS + p.orbitP) * p.orbitA;
      const oy = Math.sin(time * p.orbitS + p.orbitP) * p.orbitA;
      p.sx = sx + ox;
      p.sy = sy + oy;

      // Detach check: bottom particles, every 2 frames
      if (frame % 2 === 0 && isBottom(p) && Math.random() < 0.03) {
        const vx = (Math.random() - 0.5) * 0.6;
        const vy = Math.random() * 1.2 + 0.8;
        fallingParticles.push({
          x: p.sx, y: p.sy,
          vx, vy,
          r: p.r,
          hue: p.hue,
          alpha: p.alpha,
          life: 1.0,
          fallDist: 0,
        });
        heartParticles.splice(i, 1);
      }
    }

    // Refill heart particles
    while (heartParticles.length < HCOUNT) {
      heartParticles.push(createHeartParticle());
    }

    // Draw heart particles
    for (const p of heartParticles) {
      if (!p.sx) continue;
      // Glow
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, p.r * 3.5, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},100%,55%,${p.alpha*0.08})`;
      ctx.fill();
      // Core
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, p.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},100%,58%,${p.alpha})`;
      ctx.fill();
    }

    // ── Update falling particles ────────────────
    for (let i = fallingParticles.length - 1; i >= 0; i--) {
      const f = fallingParticles[i];
      f.vy += 0.25;  // gravity
      f.vx += (Math.random() - 0.5) * 0.08; // slight drift
      f.x += f.vx;
      f.y += f.vy;
      f.fallDist += f.vy;

      // Color transition: pink → blue as approaching pool
      const progress = Math.min(1, Math.max(0, (f.y - poolTop + 40) / 80));
      const curHue = f.hue + (250 - f.hue) * progress;

      // Hit pool
      if (f.y >= poolTop) {
        // Create splash
        const scount = 5 + Math.floor(Math.random() * 7);
        for (let j = 0; j < scount; j++) {
          const angle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI;
          const speed = 2 + Math.random() * 6;
          splashParticles.push({
            x: f.x, y: poolTop,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed * 2 - Math.random() * 4,
            r: 1 + Math.random() * 2,
            hue: 245 + Math.random() * 40,
            alpha: 0.7 + Math.random() * 0.3,
            life: 1.0,
            decay: 0.015 + Math.random() * 0.03,
          });
        }
        // Ripple
        ripples.push({ x: f.x, y: poolTop, life: 1.0, radius: 0 });

        // Add to pool
        poolParticles.push({
          x: f.x,
          baseY: poolTop + Math.random() * H * 0.08,
          r: f.r * 0.8,
          hue: 245 + Math.random() * 35,
          alpha: 0.3 + Math.random() * 0.35,
          phase: Math.random() * Math.PI * 2,
          bobAmp: 3 + Math.random() * 10,
          bobSpd: 0.3 + Math.random() * 0.7,
          rippleDx: 0, rippleDy: 0, rippleLife: 0,
        });

        // Ripple push nearby pool particles
        for (const pp of poolParticles) {
          const dx = pp.x - f.x;
          const dy = pp.baseY - poolTop;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          if (dist < 80) {
            const force = (1 - dist/80) * 15;
            pp.rippleDx += (dx/dist) * force;
            pp.rippleDy += (dy/dist) * force * 0.5;
            pp.rippleLife = 1.0;
          }
        }

        fallingParticles.splice(i, 1);
        continue;
      }

      // Draw falling particle
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 2.5, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${curHue},90%,${50+progress*10}%,${f.alpha*f.life*0.1})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${curHue},95%,${55+progress*15}%,${f.alpha*f.life})`;
      ctx.fill();

      f.life -= 0.001;
      if (f.life <= 0) { fallingParticles.splice(i, 1); }
    }

    // Cap pool particles
    while (poolParticles.length > PCOUNT + 30) poolParticles.shift();

    // ── Update & draw pool ───────────────────────
    for (let i = poolParticles.length - 1; i >= 0; i--) {
      const p = poolParticles[i];
      p.phase += p.bobSpd * 0.03;
      p.rippleLife -= 0.02;
      p.rippleDx *= 0.92;
      p.rippleDy *= 0.92;
      const px = p.x + p.rippleDx;
      const py = p.baseY + Math.sin(p.phase) * p.bobAmp + p.rippleDy;

      ctx.beginPath();
      ctx.arc(px, py, p.r * 2.5, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},60%,68%,${p.alpha*0.1})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},65%,72%,${p.alpha})`;
      ctx.fill();
    }

    // ── Update & draw splash ─────────────────────
    for (let i = splashParticles.length - 1; i >= 0; i--) {
      const s = splashParticles[i];
      s.vy += 0.3;
      s.x += s.vx;
      s.y += s.vy;
      s.life -= s.decay;
      if (s.life <= 0) { splashParticles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${s.hue},80%,70%,${s.alpha*s.life})`;
      ctx.fill();
    }

    // ── Draw ripples ─────────────────────────────
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= 0.025;
      r.radius += 2;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(160,180,255,${r.life*0.25})`;
      ctx.lineWidth = 1.5 * r.life;
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
