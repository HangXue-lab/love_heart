<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ I Love You ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #000; cursor: default;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; }
  .text {
    position: absolute; top: 20%; left: 50%;
    transform: translate(-50%, -50%); text-align: center;
    pointer-events: none; z-index: 10;
  }
  .text h1 {
    font-family: 'Georgia', serif;
    font-size: clamp(1.5rem, 4vw, 3rem); color: #fff;
    text-shadow: 0 0 20px #ff4477, 0 0 50px #ff3366, 0 0 90px #cc2255;
    animation: glow 2s ease-in-out infinite alternate;
    letter-spacing: 0.05em;
  }
  .text p {
    font-family: 'Georgia', serif;
    font-size: clamp(0.9rem, 1.6vw, 1.2rem); color: #ffb3c6;
    text-shadow: 0 0 10px #ff4477; margin-top: 0.4em; opacity: 0.9;
  }
  @keyframes glow {
    0%   { text-shadow: 0 0 15px #ff4477, 0 0 40px #ff3366, 0 0 80px #cc2255; }
    100% { text-shadow: 0 0 25px #ff6699, 0 0 60px #ff4477, 0 0 130px #cc2255; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text">
  <h1>I Love You ❤️</h1>
  <p>你是我生命中最美的意外</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Heart parametric equations ────────────────
  function hx(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function hy(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

  // ── Heart interior particles (fill the heart) ─
  const HCOUNT = 500;
  let heartParticles = [];
  function createHeartParticle() {
    // Rejection sampling for interior points
    let x, y;
    for (let attempt = 0; attempt < 30; attempt++) {
      x = (Math.random() - 0.5) * 34;
      y = (Math.random() - 0.5) * 34 + 3;
      const angle = Math.atan2(y, x);
      let t = angle;
      if (t < 0) t += Math.PI * 2;
      const hx_t = hx(t);
      const hy_t = hy(t);
      const dist = Math.sqrt(x*x + y*y);
      const curveDist = Math.sqrt(hx_t*hx_t + hy_t*hy_t);
      if (dist < curveDist * 0.92) {
        return {
          x: x, y: y,
          r:   0.8 + Math.random() * 2.5,
          hue: 340 + Math.random() * 15,
          alpha: 0.6 + Math.random() * 0.4,
          speed: 0.2 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2,
        };
      }
    }
    // Fallback
    const t = Math.random() * Math.PI * 2;
    return { x: hx(t), y: hy(t), r: 1.0 + Math.random() * 2.0, hue: 340 + Math.random() * 15, alpha: 0.5 + Math.random() * 0.5, speed: 0.3, phase: Math.random() * Math.PI * 2 };
  }
  function initHeart() {
    heartParticles = [];
    for (let i = 0; i < HCOUNT; i++) heartParticles.push(createHeartParticle());
  }
  initHeart();

  // ── Falling particles ─────────────────────────
  let falling = [];

  // ── Pool particles (bottom area) ─────────────
  const PCOUNT = 80;
  let pool = [];
  function createPool() {
    return {
      x: Math.random() * W,
      y: H * (0.74 + Math.random() * 0.2),
      r: 2 + Math.random() * 4,
      hue: 230 + Math.random() * 40, // blue-purple
      alpha: 0.3 + Math.random() * 0.4,
      phase: Math.random() * Math.PI * 2,
      power: 0,
    };
  }
  function initPool() {
    pool = [];
    for (let i = 0; i < PCOUNT; i++) pool.push(createPool());
  }
  initPool();

  // ── Splash particles ──────────────────────────
  let splash = [];

  // ── Wave ripples ──────────────────────────────
  let ripples = [];

  let time = 0;

  function draw() {
    time += 0.016;
    const scl = Math.min(W, H) * 0.03;
    const cx = W / 2;
    const cy = H / 2 - H * 0.06;
    const poolY = H * 0.82;
    const beat = 1 + 0.06 * Math.sin(time * 4.0); // breathing

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    // ── Heart glow ──────────────────────────────
    const hGlow = ctx.createRadialGradient(cx, cy, scl*2, cx, cy, scl*15);
    hGlow.addColorStop(0, 'rgba(255,50,90,0.18)');
    hGlow.addColorStop(0.6, 'rgba(255,30,70,0.05)');
    hGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hGlow;
    ctx.beginPath(); ctx.arc(cx, cy, scl*15, 0, Math.PI*2); ctx.fill();

    // ── Draw pool base glow ─────────────────────
    const pGlow = ctx.createRadialGradient(cx, poolY, H*0.08, cx, poolY, H*0.5);
    pGlow.addColorStop(0, 'rgba(120,140,255,0.08)');
    pGlow.addColorStop(0.5, 'rgba(100,120,240,0.03)');
    pGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = pGlow;
    ctx.fillRect(0, poolY - H*0.15, W, H*0.35);

    // ── Update heart particles ──────────────────
    for (let i = heartParticles.length - 1; i >= 0; i--) {
      const p = heartParticles[i];
      p.phase += p.speed * 0.05;

      // Heart position with beat
      const hx_p = hx(p.x) * scl * beat;
      const hy_p = hy(p.y) * scl * beat;
      const px = cx + hx_p + Math.cos(p.phase) * p.r * 0.4;
      const py = cy + hy_p + Math.sin(p.phase) * p.r * 0.4;

      // Bottom particles detach
      if (hy(p.y) < -6 && Math.random() < 0.04) {
        falling.push({
          x: px, y: py,
          vx: (Math.random() - 0.5) * 0.7,
          vy: Math.random() * 1.5 + 1.0,
          r: p.r, hue: p.hue, alpha: p.alpha,
          life: 1.0
        });
        heartParticles.splice(i, 1);
        continue;
      }

      // Draw heart particle
      ctx.beginPath();
      ctx.arc(px, py, p.r * 2, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},100%,55%,${p.alpha*0.08})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},100%,62%,${p.alpha})`;
      ctx.fill();
    }
    // Refill heart
    while (heartParticles.length < HCOUNT) heartParticles.push(createHeartParticle());

    // ── Update falling particles ────────────────
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i];
      f.vy += 0.28; f.x += f.vx; f.y += f.vy; f.life -= 0.003;

      if (f.y >= poolY) {
        // Splash on impact
        const n = 6 + Math.floor(Math.random() * 8);
        for (let j = 0; j < n; j++) {
          const a = -Math.PI/2 + (Math.random() - 0.5) * Math.PI * 0.8;
          const sp = 3 + Math.random() * 6;
          splash.push({
            x: f.x, y: poolY,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 3,
            r: 1 + Math.random() * 2.5,
            hue: 240 + Math.random() * 35,
            alpha: 0.8, life: 1.0
          });
        }
        // Ripple
        ripples.push({ x: f.x, y: poolY, r: 0, a: 1.0 });

        // Add to pool with slight spread
        pool.push({
          x: f.x + (Math.random() - 0.5) * 30,
          y: poolY + (Math.random() - 0.5) * 20,
          r: f.r * 0.7,
          hue: 240 + Math.random() * 35,
          alpha: 0.3 + Math.random() * 0.4,
          phase: Math.random() * Math.PI * 2,
          power: 0.5
        });
        falling.splice(i, 1);
        continue;
      }

      // Draw falling
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 1.5, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${f.hue},90%,${55+(poolY-f.y)/200}%,${f.alpha*f.life})`;
      ctx.fill();
    }

    // ── Update pool particles ───────────────────
    for (let i = pool.length - 1; i >= 0; i--) {
      const p = pool[i];
      if (p.power > 0) {
        p.power -= 0.05;
        p.x += (Math.random() - 0.5) * 1.5;
        p.y += (Math.random() - 0.5) * 0.8;
      }
      p.phase += 0.03;
      p.y += Math.sin(p.phase) * 0.3;

      // Remove if too old or duplicated
      if (p.y > H + 20) { pool.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 2.5, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},60%,70%,${p.alpha*0.15})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.8, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},70%,80%,${p.alpha*0.8})`;
      ctx.fill();
    }
    while (pool.length > PCOUNT) pool.shift();

    // ── Update splash particles ─────────────────
    for (let i = splash.length - 1; i >= 0; i--) {
      const s = splash[i];
      s.vy += 0.25; s.x += s.vx; s.y += s.vy; s.life -= 0.015;
      if (s.life <= 0 || s.y > H + 20) { splash.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${s.hue},80%,75%,${s.alpha*s.life})`;
      ctx.fill();
    }

    // ── Draw ripples ────────────────────────────
    for (let i = ripples.length - 1; i >= 0; i--) {
      const w = ripples[i];
      w.r += 2.5; w.a -= 0.02;
      if (w.a <= 0) { ripples.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(140,160,255,${w.a*0.3})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
