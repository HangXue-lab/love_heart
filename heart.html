<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ I Love You ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #08080c;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }
  .text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  .text h1 {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(1.8rem, 5vw, 4rem);
    color: #fff;
    text-shadow:
      0 0 10px #ff4477,
      0 0 30px #ff4477,
      0 0 60px #ff3366,
      0 0 100px #cc2255;
    animation: glow 2s ease-in-out infinite alternate;
  }
  .text p {
    font-family: 'Georgia', serif;
    font-size: clamp(0.9rem, 1.8vw, 1.3rem);
    color: #ffb3c6;
    text-shadow: 0 0 10px #ff4477;
    margin-top: 0.4em;
    opacity: 0.85;
  }
  @keyframes glow {
    0%   { text-shadow: 0 0 10px #ff4477, 0 0 30px #ff4477, 0 0 60px #ff3366, 0 0 100px #cc2255; }
    100% { text-shadow: 0 0 20px #ff6699, 0 0 50px #ff4477, 0 0 80px #ff3366, 0 0 140px #cc2255; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text">
  <h1>I Love You ❤️</h1>
  <p>你是我生命中最美的意外</p>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Heart curve ─────────────────────────────────
  function hx(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function hy(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

  // ── Particles ───────────────────────────────────
  const N = 600;
  const particles = [];
  for (let i = 0; i < N; i++) {
    const t = (i / N) * Math.PI * 2;
    // Random offset for 3D volume feel
    const jx = (Math.random() - 0.5) * 0.35;
    const jy = (Math.random() - 0.5) * 0.35;
    particles.push({
      t,
      jx, jy,
      r: 1.0 + Math.random() * 3.0,
      hue: 340 + Math.random() * 20,
      alpha: 0.55 + Math.random() * 0.45,
      orbitAmp: 0.5 + Math.random() * 2.5,
      orbitSpd: 0.2 + Math.random() * 1.2,
      orbitPhs: Math.random() * Math.PI * 2,
      highlight: Math.random() < 0.08, // ~8% are highlight particles
    });
  }

  let time = 0;

  function draw() {
    time += 0.016;
    const scl = Math.min(W, H) * 0.03;        // scale factor
    const cx = W / 2;
    const cy = H / 2 - H * 0.04;
    const beat = 1 + 0.07 * Math.sin(time * 4.0); // breathing 0.93 ~ 1.07

    ctx.clearRect(0, 0, W, H);

    // ── Background ──────────────────────────────
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#180a10');
    bg.addColorStop(0.6, '#0a0a10');
    bg.addColorStop(1, '#050508');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // ── Big soft glow behind heart ──────────────
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const glow = ctx.createRadialGradient(cx, cy, scl * 2, cx, cy, scl * 17);
    glow.addColorStop(0, 'rgba(255,50,90,0.18)');
    glow.addColorStop(0.4, 'rgba(255,40,75,0.06)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, scl * 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ── Draw particles ──────────────────────────
    for (const p of particles) {
      // Position on heart curve * beat * scale + random offset + orbit
      const bx = cx + (hx(p.t) + p.jx) * scl * beat;
      const by = cy + (hy(p.t) + p.jy) * scl * beat;
      const ox = Math.cos(time * p.orbitSpd + p.orbitPhs) * p.orbitAmp;
      const oy = Math.sin(time * p.orbitSpd + p.orbitPhs) * p.orbitAmp;
      const px = bx + ox;
      const py = by + oy;

      // Glow halo (larger, faint)
      ctx.beginPath();
      ctx.arc(px, py, p.r * (p.highlight ? 5 : 3), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, 55%, ${p.alpha * 0.12})`;
      ctx.fill();

      // Core dot
      ctx.beginPath();
      ctx.arc(px, py, p.r * (p.highlight ? 1.8 : 1.0), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, ${p.highlight ? 72 : 60}%, ${p.alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
