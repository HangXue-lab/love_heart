<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ I Love You ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0a0a0a;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }
  .text-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  .text-overlay h1 {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(2rem, 6vw, 4.5rem);
    color: #fff;
    text-shadow:
      0 0 10px #ff3366,
      0 0 20px #ff3366,
      0 0 40px #ff3366,
      0 0 80px #ff3366,
      0 0 120px #c41e3a;
    animation: textGlow 2s ease-in-out infinite alternate;
    letter-spacing: 0.05em;
  }
  .text-overlay p {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(1rem, 2vw, 1.5rem);
    color: #ffb3c6;
    text-shadow: 0 0 10px #ff3366;
    margin-top: 0.5em;
    opacity: 0.8;
  }
  @keyframes textGlow {
    0% { text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366, 0 0 40px #ff3366, 0 0 80px #c41e3a; }
    100% { text-shadow: 0 0 20px #ff6699, 0 0 40px #ff3366, 0 0 80px #ff3366, 0 0 120px #c41e3a, 0 0 160px #ff3366; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="text-overlay">
  <h1>I Love You ❤️</h1>
  <p>你是我生命中最美的意外</p>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initStars();
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Heart parametric equation ──────────────────────────
  function scale() { return Math.min(W, H) * 0.03; }
  function heartX(t) { return 16 * Math.pow(Math.sin(t), 3); }
  function heartY(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)); }
  const cx = () => W / 2;
  const cy = () => H / 2 - H * 0.04;

  // ── Heart particles ────────────────────────────────────
  const HEART_PARTICLE_COUNT = 350;
  const heartParticles = [];

  for (let i = 0; i < HEART_PARTICLE_COUNT; i++) {
    heartParticles.push({
      t: (i / HEART_PARTICLE_COUNT) * Math.PI * 2,
      jitter: 0.85 + Math.random() * 0.3,
      x: 0, y: 0,
      size: 1.2 + Math.random() * 2.8,
      hue: 340 + Math.random() * 20,
      alpha: 0.6 + Math.random() * 0.4,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.7,
    });
  }

  // ── Stars ──────────────────────────────────────────────
  const STAR_COUNT = 120;
  const stars = [];
  function initStars() {
    stars.length = 0;
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: 0.4 + Math.random() * 1.6,
        alpha: 0.3 + Math.random() * 0.7,
        twinkleSpeed: 0.005 + Math.random() * 0.03,
        twinklePhase: Math.random() * Math.PI * 2,
      });
    }
  }
  initStars();

  // ── Floating hearts ────────────────────────────────────
  const FLOATING_MAX = 25;
  const floatingHearts = [];

  function spawnFloatingHeart() {
    const s = 0.6 + Math.random() * 1.8;
    floatingHearts.push({
      x: Math.random() * W * 0.8 + W * 0.1,
      y: H + 20,
      scale: s,
      speed: 1.2 + Math.random() * 2.5,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.01 + Math.random() * 0.03,
      alpha: 0.5 + Math.random() * 0.5,
      size: 8 + Math.random() * 18,
      hue: 340 + Math.random() * 20,
    });
  }

  // ── Mouse trail ────────────────────────────────────────
  const TRAIL_MAX = 40;
  const trailParticles = [];
  let mouseX = -100, mouseY = -100;
  let mouseActive = false;

  window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    mouseActive = true;
  });
  window.addEventListener('mouseleave', () => { mouseActive = false; });
  window.addEventListener('touchmove', e => {
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    mouseActive = true;
  }, { passive: true });
  window.addEventListener('touchend', () => { mouseActive = false; });

  // ── Draw small heart path ──────────────────────────────
  function drawSmallHeart(ctx, x, y, size) {
    const s = size / 18;
    ctx.beginPath();
    const pts = 40;
    for (let i = 0; i <= pts; i++) {
      const t = (i / pts) * Math.PI * 2;
      const hx = x + heartX(t) * s;
      const hy = y + heartY(t) * s;
      if (i === 0) ctx.moveTo(hx, hy);
      else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
  }

  // ── Animation loop ─────────────────────────────────────
  let time = 0;

  function animate() {
    time += 0.016;
    ctx.clearRect(0, 0, W, H);

    // Background gradient
    const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
    bgGrad.addColorStop(0, '#1a0a12');
    bgGrad.addColorStop(0.7, '#0d0d14');
    bgGrad.addColorStop(1, '#060608');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
      s.twinklePhase += s.twinkleSpeed;
      const alpha = s.alpha * (0.5 + 0.5 * Math.sin(s.twinklePhase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,230,240,${alpha})`;
      ctx.fill();
    }

    // Breathing effect
    const breathe = 1 + 0.04 * Math.sin(time * 2.5);
    const centerX = cx();
    const centerY = cy();

    // Heart particles
    const sc = scale();
    for (const p of heartParticles) {
      const bx = centerX + heartX(p.t) * sc * p.jitter * breathe;
      const by = centerY + heartY(p.t) * sc * p.jitter * breathe;
      // Small orbital motion
      const orbX = Math.cos(time * p.speed + p.phase) * 1.5;
      const orbY = Math.sin(time * p.speed + p.phase) * 1.5;
      p.x = bx + orbX;
      p.y = by + orbY;
    }

    // Draw heart glow layer
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // Large soft glow
    const glowGrad = ctx.createRadialGradient(centerX, centerY, sc * 3, centerX, centerY, sc * 14);
    glowGrad.addColorStop(0, 'rgba(255,51,102,0.25)');
    glowGrad.addColorStop(0.5, 'rgba(255,30,80,0.08)');
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sc * 14, 0, Math.PI * 2);
    ctx.fill();

    // Draw heart particles
    for (const p of heartParticles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 90%, 60%, ${p.alpha})`;
      ctx.fill();
      // Tiny glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, 55%, ${p.alpha * 0.15})`;
      ctx.fill();
    }
    ctx.restore();

    // Floating hearts
    for (let i = floatingHearts.length - 1; i >= 0; i--) {
      const f = floatingHearts[i];
      f.y -= f.speed;
      f.wobble += f.wobbleSpeed;
      f.x += Math.sin(f.wobble) * 0.4;

      if (f.y < -50) {
        floatingHearts.splice(i, 1);
        continue;
      }

      const hx = f.x;
      const hy = f.y;
      const hs = f.size * f.scale;

      ctx.save();
      ctx.globalAlpha = f.alpha;
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 8;
      drawSmallHeart(ctx, hx, hy, hs);
      ctx.fillStyle = `hsl(${f.hue}, 85%, 62%)`;
      ctx.fill();
      ctx.restore();
    }

    // Maintain floating heart count
    while (floatingHearts.length < FLOATING_MAX) spawnFloatingHeart();

    // Mouse trail (throttle to every 2nd frame)
    if (mouseActive && Math.floor(time * 60) % 2 === 0) {
      trailParticles.push({
        x: mouseX,
        y: mouseY,
        life: 1,
        size: 3 + Math.random() * 6,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5 - 0.5,
        hue: 340 + Math.random() * 20,
      });
    }

    for (let i = trailParticles.length - 1; i >= 0; i--) {
      const t = trailParticles[i];
      t.life -= 0.02;
      t.x += t.vx;
      t.y += t.vy;
      t.vy -= 0.05;

      if (t.life <= 0) {
        trailParticles.splice(i, 1);
        continue;
      }

      ctx.beginPath();
      ctx.arc(t.x, t.y, t.size * t.life, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${t.hue}, 100%, 65%, ${t.life * 0.8})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.size * t.life * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${t.hue}, 100%, 55%, ${t.life * 0.2})`;
      ctx.fill();
    }

    // Cap trail particles
    while (trailParticles.length > TRAIL_MAX) trailParticles.shift();

    requestAnimationFrame(animate);
  }

  // ── Start ──────────────────────────────────────────────
  animate();
})();
</script>
</body>
</html>
