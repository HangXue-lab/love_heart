<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  canvas { display: block; position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;
function sz(){W=c.width=innerWidth;H=c.height=innerHeight}
addEventListener('resize',sz);sz();

const PI2=Math.PI*2;

// ═══ Heart equation (standard, y-up) ═══
const hx=t=>16*Math.sin(t)**3;
// standard: y increases upward, notch at y≈5, tip at y≈-17
const hys=t=>13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);

// Precompute polygon
const PN=200, pX=new Float64Array(PN), pY=new Float64Array(PN);
for(let i=0;i<PN;i++){const t=i/PN*PI2;pX[i]=hx(t);pY[i]=hys(t);}
function inside(x,y){let r=!1;for(let i=0,j=PN-1;i<PN;i++){const xi=pX[i],yi=pY[i],xj=pX[j],yj=pY[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)r=!r;j=i}return r}

// ═══ Heart particles ═══
const HCNT=500; let heart=[];
function mkHeart(){
  for(let a=0;a<40;a++){
    const x=(Math.random()-.5)*34;           // x in [-17,17]
    const y=Math.random()*23-14;             // y in [-14,9] — shifted sampling range
    if(inside(x,y)){
      return {x,y, r:.7+Math.random()*2.8, h:340+Math.random()*18, a:.5+Math.random()*.5, ph:Math.random()*PI2, oA:.1+Math.random()*1., oS:.3+Math.random()*.8};
    }
  }
  const t=Math.random()*PI2;
  return {x:hx(t),y:hys(t), r:1+Math.random()*2.2, h:340+Math.random()*18, a:.5+Math.random()*.5, ph:Math.random()*PI2, oA:.2+Math.random()*1.2, oS:.3+Math.random()*.8};
}
for(let i=0;i<HCNT;i++)heart.push(mkHeart());

// ═══ Pool, falling, splash, ripples ═══
const PCNT=80; let pool=[], falling=[], splash=[], ripples=[];
function mkPool(){
  return {x:Math.random()*W, baseY:H*(.76+Math.random()*.16), r:2+Math.random()*4.5, h:230+Math.random()*40, a:.2+Math.random()*.4, ph:Math.random()*PI2, bA:2+Math.random()*8, bS:.3+Math.random()*.6, pX:0,pY:0};
}
for(let i=0;i<PCNT;i++)pool.push(mkPool());

let T=0, F=0;

function draw(){
  T+=.016; F++;
  const scl=Math.min(W,H)*.03;
  const sclY=scl*.68;  // y-compress for plumper heart
  const cx=W/2;
  const cy=H/2+H*.04;  // center heart body lower on screen
  const beat=1+.06*Math.sin(T*4);
  const surf=H*.75;

  ctx.clearRect(0,0,W,H); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

  // Heart ambient glow
  const g1=ctx.createRadialGradient(cx,cy-H*.04,scl*2,cx,cy-H*.04,scl*15);
  g1.addColorStop(0,'rgba(255,40,80,.12)'); g1.addColorStop(.5,'rgba(255,30,70,.03)'); g1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g1; ctx.beginPath(); ctx.arc(cx,cy-H*.04,scl*15,0,PI2); ctx.fill();

  // Pool glow
  const g2=ctx.createRadialGradient(cx,surf+H*.06,H*.02,cx,surf+H*.08,H*.38);
  g2.addColorStop(0,'rgba(130,150,255,.05)'); g2.addColorStop(.5,'rgba(100,130,240,.02)'); g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g2; ctx.fillRect(0,surf-H*.1,W,H*.35);

  // ═══ HEART PARTICLES ═══
  for(let i=heart.length-1;i>=0;i--){
    const p=heart[i];
    // Render with y-negation (standard eq has y-up, canvas is y-down)
    // AND y-compression for plumper shape
    let sx=cx+p.x*scl*beat;
    let sy=cy-p.y*sclY*beat; // negate y for canvas
    // Tiny orbit
    p.ph+=p.oS*.04;
    sx+=Math.cos(p.ph)*p.oA; sy+=Math.sin(p.ph)*p.oA;

    // Detach bottom particles (tip at y≈-17 in standard eq)
    if(p.y<-6&&F%2===0&&Math.random()<.03){
      falling.push({x:sx,y:sy, vx:(Math.random()-.5)*.6, vy:Math.random()*1.2+.8, r:p.r, h:p.h, a:p.a});
      heart.splice(i,1); continue;
    }
    // Draw
    ctx.beginPath(); ctx.arc(sx,sy,p.r*3,0,PI2);
    ctx.fillStyle=`hsla(${p.h},100%,55%,${p.a*.06})`; ctx.fill();
    ctx.beginPath(); ctx.arc(sx,sy,p.r,0,PI2);
    ctx.fillStyle=`hsla(${p.h},100%,58%,${p.a})`; ctx.fill();
  }
  while(heart.length<HCNT)heart.push(mkHeart());

  // ═══ FALLING ═══
  for(let i=falling.length-1;i>=0;i--){
    const f=falling[i];
    f.vy+=.28; f.x+=f.vx; f.y+=f.vy;
    if(f.y>=surf){
      const n=5+Math.floor(Math.random()*8);
      for(let j=0;j<n;j++){
        const a=Math.random()*PI2, sp=2+Math.random()*5;
        splash.push({x:f.x,y:surf, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp*.6-Math.random()*4, r:1+Math.random()*2.5, h:235+Math.random()*35, a:.75+Math.random()*.25, life:1});
      }
      ripples.push({x:f.x,y:surf,r:0,a:1});
      for(const pp of pool){
        const dx=pp.x-f.x, dy=pp.baseY-surf, dist=Math.sqrt(dx*dx+dy*dy)||1;
        if(dist<90){const force=(1-dist/90)*20; pp.pX+=dx/dist*force; pp.pY+=dy/dist*force*.4;}
      }
      pool.push({x:f.x+(Math.random()-.5)*40, baseY:surf+Math.random()*H*.08, r:f.r*.7, h:235+Math.random()*35, a:.2+Math.random()*.35, ph:Math.random()*PI2, bA:2+Math.random()*8, bS:.3+Math.random()*.6, pX:0,pY:0});
      falling.splice(i,1); continue;
    }
    const t=Math.min(1,Math.max(0,(f.y-surf+60)/80)), ch=f.h+(245-f.h)*t;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r*2,0,PI2);
    ctx.fillStyle=`hsla(${ch},80%,${45+t*15}%,${f.a*.08})`; ctx.fill();
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,PI2);
    ctx.fillStyle=`hsla(${ch},90%,${55+t*18}%,${f.a})`; ctx.fill();
  }

  // ═══ POOL ═══
  for(let i=pool.length-1;i>=0;i--){
    const p=pool[i];
    p.ph+=p.bS*.03; p.pX*=.93; p.pY*=.93;
    const py=p.baseY+Math.sin(p.ph)*p.bA+p.pY, pxx=p.x+p.pX;
    ctx.beginPath(); ctx.arc(pxx,py,p.r*2.5,0,PI2);
    ctx.fillStyle=`hsla(${p.h},55%,66%,${p.a*.08})`; ctx.fill();
    ctx.beginPath(); ctx.arc(pxx,py,p.r*.7,0,PI2);
    ctx.fillStyle=`hsla(${p.h},60%,78%,${p.a*.9})`; ctx.fill();
  }
  while(pool.length>PCNT+40)pool.shift();

  // ═══ SPLASH ═══
  for(let i=splash.length-1;i>=0;i--){
    const s=splash[i];
    s.vy+=.22; s.x+=s.vx; s.y+=s.vy; s.life-=.018;
    if(s.life<=0||s.y>H+30){splash.splice(i,1);continue}
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*s.life,0,PI2);
    ctx.fillStyle=`hsla(${s.h},80%,72%,${s.a*s.life})`; ctx.fill();
  }

  // ═══ RIPPLES ═══
  for(let i=ripples.length-1;i>=0;i--){
    const w=ripples[i];
    w.r+=2.5; w.a-=.025;
    if(w.a<=0){ripples.splice(i,1);continue}
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,PI2);
    ctx.strokeStyle=`rgba(130,155,255,${w.a*.3})`; ctx.lineWidth=2*w.a; ctx.stroke();
  }
  requestAnimationFrame(draw);
}
draw();
})();
</script>
</body>
</html>
