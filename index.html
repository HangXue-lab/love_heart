<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子爱心</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a0f;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * 粒子爱心 — 真实心跳节律驱动聚散
 */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- 1. 布局 ---
let W, H, heartScale, cx, cy;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  heartScale = Math.min(W, H) * 0.25;   // 归一化坐标约±1.35，乘以此系数得到像素
  cx = W * 0.5;
  cy = H * 0.48;                         // 略微上移，视觉居中
}
resize();
window.addEventListener('resize', resize);

// --- 2. 心形粒子生成（内部填充 + 边界加密）---

function heartValue(x, y) {
  const x2 = x * x, y2 = y * y;
  return (x2 + y2 - 1) ** 3 + x2 * y2 * y;
}

function insideHeart(x, y) {
  return heartValue(x, y) <= 0;
}

const INTERIOR_COUNT = 1050;
const OUTLINE_COUNT = 300;
const NOTCH_COUNT = 70;
const particles = [];
const BOUND_X = 1.35, BOUND_Y_TOP = -1.15, BOUND_Y_BOT = 1.55;

function randomInteriorPoint() {
  let ix, iy;
  do {
    ix = (Math.random() - 0.5) * 2 * BOUND_X;
    iy = Math.random() * (BOUND_Y_BOT - BOUND_Y_TOP) + BOUND_Y_TOP;
  } while (!insideHeart(ix, iy));
  return { x: ix, y: iy };
}

function boundaryPointAtAngle(angle) {
  let low = 0;
  let high = 2;

  for (let i = 0; i < 24; i++) {
    const mid = (low + high) * 0.5;
    const x = Math.cos(angle) * mid;
    const y = Math.sin(angle) * mid;
    if (insideHeart(x, y)) low = mid;
    else high = mid;
  }

  return {
    x: Math.cos(angle) * low,
    y: Math.sin(angle) * low,
  };
}

function createParticle(x, y, type) {
  const isOutline = type !== 'interior';
  const opacity = type === 'outline'
    ? 0.84 + Math.random() * 0.16
    : isOutline ? 0.78 + Math.random() * 0.20 : 0.50 + Math.random() * 0.38;

  particles.push({
    hx: x,
    hy: y,
    type,
    size: isOutline ? Math.random() * 0.9 + 0.85 : Math.random() * 1.25 + 0.65,
    phase1: Math.random() * Math.PI * 2,
    phase2: Math.random() * Math.PI * 2,
    phase3: Math.random() * Math.PI * 2,
    phase4: Math.random() * Math.PI * 2,
    opacity,
  });
}

for (let i = 0; i < INTERIOR_COUNT; i++) {
  const p = randomInteriorPoint();
  createParticle(p.x, p.y, 'interior');
}

for (let i = 0; i < OUTLINE_COUNT; i++) {
  const angle = (i / OUTLINE_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.012;
  const p = boundaryPointAtAngle(angle);
  createParticle(p.x, p.y, 'outline');
}

for (let i = 0; i < NOTCH_COUNT; i++) {
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.52;
  const p = boundaryPointAtAngle(angle);
  createParticle(p.x, p.y, 'notch');
}

// --- 3. 颜色映射 ---
function colorFor(x, y) {
  const absX = Math.abs(x) / BOUND_X;
  const yNorm = (y - BOUND_Y_TOP) / (BOUND_Y_BOT - BOUND_Y_TOP);
  const r = Math.round(220 + absX * 35);
  const g = Math.round(20 + absX * 60 + yNorm * 30);
  const b = Math.round(60 + absX * 120 + yNorm * 40);
  return { r, g, b };
}

for (const p of particles) {
  const c = colorFor(p.hx, p.hy);
  p.r = c.r; p.g = c.g; p.b = c.b;
}

// --- 4. 心跳节奏函数 ---
// 单脉冲平滑节律, 周期 ~1.5s (40 BPM)
const PERIOD = 1.5;

function heartbeatScale(t) {
  const phase = (t % PERIOD) / PERIOD;
  // sin² 脉冲 → 平滑的单次收缩-舒张
  const p = Math.sin(Math.PI * phase);
  const contraction = Math.pow(Math.max(0, p), 3);
  return 1 - contraction * 0.18;
}

// --- 5. 粒子光晕纹理 ---
const glowSize = 28;
const glowCanvas = document.createElement('canvas');
glowCanvas.width = glowSize;
glowCanvas.height = glowSize;
const gctx = glowCanvas.getContext('2d');
const gradient = gctx.createRadialGradient(glowSize/2, glowSize/2, 0, glowSize/2, glowSize/2, glowSize/2);
gradient.addColorStop(0,    'rgba(255,255,255,0.55)');
gradient.addColorStop(0.12, 'rgba(255,255,255,0.25)');
gradient.addColorStop(0.30, 'rgba(255,120,120,0.06)');
gradient.addColorStop(1,    'rgba(0,0,0,0)');
gctx.fillStyle = gradient;
gctx.fillRect(0, 0, glowSize, glowSize);

// --- 6. 渲染循环 ---
function draw(time) {
  const t = time * 0.001;
  const beat = heartbeatScale(t);
  const hs = heartScale * beat;

  ctx.fillStyle = 'rgba(10,10,15,0.55)';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  for (const p of particles) {
    const sx = cx + p.hx * hs;
    const sy = cy + p.hy * hs;

    const drift = p.type === 'interior' ? 1 : 0.58;
    const dx = (Math.sin(t * 1.3 + p.phase1) * 1.5 + Math.cos(t * 1.7 + p.phase2) * 1.0) * drift;
    const dy = (Math.cos(t * 1.1 + p.phase3) * 1.5 + Math.sin(t * 1.5 + p.phase4) * 1.0) * drift;

    const fx = sx + dx;
    const fy = sy + dy;

    const coreR = p.size * (p.type === 'interior' ? 0.9 : 1.04);
    ctx.globalAlpha = p.opacity * (p.type === 'interior' ? 0.75 : p.type === 'outline' ? 1 : 0.96);
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.beginPath();
    ctx.arc(fx, fy, coreR, 0, Math.PI * 2);
    ctx.fill();

    const haloR = glowSize * p.size * (p.type === 'interior' ? 0.34 : p.type === 'outline' ? 0.45 : 0.42);
    ctx.globalAlpha = p.opacity * (p.type === 'interior' ? 0.28 : p.type === 'outline' ? 0.54 : 0.46);
    ctx.drawImage(glowCanvas, fx - haloR, fy - haloR, haloR * 2, haloR * 2);
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
